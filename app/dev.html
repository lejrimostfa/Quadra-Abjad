<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Quadra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Une colonne, largeur téléphone. La grille 4 x 4 de la langue est le motif de la page. */
:root {
  --bg: #f4f6f2; --surface: #ffffff; --fg: #161a1e; --muted: #5d6670; --line: #d3d8d0;
  --accent: #1d5c8a; --accent-ink: #ffffff; --ok: #2a7a4b; --bad: #b23a2f;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --surface: #1b1e22; --fg: #e8ebe6; --muted: #9aa3ab; --line: #30353b;
  --accent: #6db3e6; --accent-ink: #0f1a22; --ok: #5fc48a; --bad: #e67a6c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1b1e22; --fg: #e8ebe6; --muted: #9aa3ab; --line: #30353b;
  --accent: #6db3e6; --accent-ink: #0f1a22; --ok: #5fc48a; --bad: #e67a6c; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); }
main { max-width: 480px; margin: 0 auto; padding: 16px 16px 32px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 2.4rem; letter-spacing: -0.02em; }
h2 { font-size: 1.3rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 0.9em; letter-spacing: 0.04em; }
.eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible, .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { min-height: 48px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }

/* Accueil */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.units { display: grid; gap: 6px; list-style: none; padding: 0; margin: 0; }
.unit { display: grid; grid-template-columns: 2.2rem 1fr auto; gap: 10px; align-items: center; width: 100%;
  text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.unit .n { font-family: var(--mono); color: var(--muted); font-size: 0.85rem; }
.unit .score { font-variant-numeric: tabular-nums; font-size: 0.85rem; color: var(--muted); }
.unit.done .score { color: var(--ok); font-weight: 600; }
main > section, .hero, .hero > * { min-width: 0; max-width: 100%; }
.hero { padding: 8px 0 0; display: grid; gap: 8px; }
#hero-glyph { overflow: hidden; }
#hero-glyph svg { width: 100%; max-width: 340px; height: auto; display: block; }

/* Leçon */
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s; }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; display: grid; gap: 14px; }
.show { min-height: 64px; display: flex; align-items: center; justify-content: center; overflow-x: auto; padding: 4px 0; }
.show.big { font-family: var(--display); font-size: 3rem; font-weight: 700; }
.choices { display: grid; gap: 8px; }
.choice { min-height: 48px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); text-align: left; display: flex; align-items: center; gap: 12px; }
.choice[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choice.ok { border-color: var(--ok); }
.choice.bad { border-color: var(--bad); }
.tokens { display: flex; flex-wrap: wrap; gap: 8px; }
.tokens .choice { min-height: 44px; padding: 6px 10px; }
.input { min-height: 72px; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 12px; overflow-x: auto; }
.input .mono { color: var(--muted); }
input[type="number"] { font: inherit; font-size: 1.4rem; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
#kb .qk { --qk-bg: var(--surface); --qk-key: var(--bg); --qk-fg: var(--fg); --qk-border: var(--line); --qk-active: var(--line); --qk-accent: var(--accent); --qk-muted: var(--muted); padding: 0; }
.feedback { border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; border: 1px solid; }
.feedback.ok { border-color: var(--ok); }
.feedback.bad { border-color: var(--bad); }
.feedback .title { font-family: var(--display); font-weight: 700; font-size: 1.1rem; }
.feedback.ok .title { color: var(--ok); }
.feedback.bad .title { color: var(--bad); }
.speak { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); flex: none; display: inline-flex; align-items: center; justify-content: center; }
.speak svg { width: 20px; height: 20px; fill: currentColor; }
.end { text-align: center; display: grid; gap: 14px; padding: 24px 0; }
.end b { font-family: var(--display); font-size: 3rem; display: block; line-height: 1; }
</style>

<main>
  <section id="home">
    <div class="hero">
      <p class="eyebrow">Quatre consonnes, quatre voyelles</p>
      <h1>Quadra</h1>
      <div id="hero-glyph" aria-hidden="true"></div>
      <p class="muted">Apprends à lire, écrire et entendre le Quadra Abjad, une syllabe à la fois.</p>
    </div>
    <div class="stats">
      <div class="stat"><span class="eyebrow">Vus</span><b id="st-seen">0</b></div>
      <div class="stat"><span class="eyebrow">Sus</span><b id="st-known">0</b></div>
      <div class="stat"><span class="eyebrow">À revoir</span><b id="st-due">0</b></div>
    </div>
    <div class="row">
      <button class="btn primary" id="btn-next" style="flex:1">Leçon suivante</button>
      <button class="btn" id="btn-review" style="flex:1">Réviser</button>
    </div>
    <h2>Unités</h2>
    <ul class="units" id="units"></ul>
    <p class="muted" id="home-note">Ta progression reste sur cet appareil.</p>
  </section>

  <section id="lesson" hidden>
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="btn-quit">Quitter</button>
      <span class="mono" id="counter">1 / 10</span>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="card">
      <p class="eyebrow" id="ex-type"></p>
      <h2 id="prompt"></h2>
      <div class="row" id="show-row"><div class="show" id="show"></div><button class="speak" id="btn-speak" hidden aria-label="Écouter"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button></div>
      <div id="answer"></div>
      <div id="kb"></div>
      <div id="feedback" hidden></div>
      <button class="btn primary wide" id="btn-check">Valider</button>
    </div>
  </section>

  <section id="end" hidden>
    <div class="end">
      <p class="eyebrow">Leçon terminée</p>
      <b id="end-score">0 / 10</b>
      <p id="end-text" class="muted"></p>
      <button class="btn primary" id="btn-home">Retour à l'accueil</button>
    </div>
  </section>
</main>
<script type="module" src="./js/app.js"></script>
</body></html>
